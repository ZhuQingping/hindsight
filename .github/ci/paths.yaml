core:
  - 'hindsight-api-slim/**'
  - 'hindsight-api/**'
  - 'scripts/**'
  - '.python-version'
  - '.env.example'
  # The workspace lockfile and root manifest determine which versions
  # the API actually runs against, so a change to either can break it
  # without touching a line of source. Both are deliberately bare
  # patterns: they match only the files at the repository root. A
  # glob such as '**/uv.lock' would pull every integration lockfile
  # into the core suite.
  - 'uv.lock'
  - 'pyproject.toml'
clients-ts:
  - 'hindsight-clients/typescript/**'
  - 'package.json'
  - 'package-lock.json'
clients-python:
  - 'hindsight-clients/python/**'
clients-rust:
  - 'hindsight-clients/rust/**'
  # The Rust client is not committed source — build.rs regenerates it with
  # progenitor from this spec, and progenitor emits query params POSITIONALLY
  # in alphabetical order. So adding one query param to any endpoint shifts
  # every later argument and breaks the call sites, with nothing under
  # hindsight-clients/rust/ changed to trigger this job (#4509).
  - 'hindsight-docs/static/openapi.json'
clients-go:
  - 'hindsight-clients/go/**'
control-plane:
  - 'contextbase-control-plane/**'
  - 'hindsight-extensions/contextdb-service/tests/ui/**'
  - 'package.json'
  - 'package-lock.json'
cli:
  - 'hindsight-cli/**'
  # Same reason as clients-rust above: the CLI compiles against the
  # progenitor-generated client, so an OpenAPI change alone can break it.
  - 'hindsight-docs/static/openapi.json'
figures:
  - 'hindsight-docs/figures/**'
  - 'scripts/docs_skill_figures.py'
  # The Giotto pin lives here: a new Giotto can stop a figure from drawing.
  - 'hindsight-docs/package.json'
docker:
  - 'docker/**'
helm:
  - 'helm/**'
# The RUNNABLE samples only. This replaces a broad `docs` filter that also
# matched 'hindsight-docs/**', '*.md' and 'hindsight-integrations/**' — the
# last of those so an integration rename would be caught by the docs build's
# integrations check, except that build (build-docs) has no `if:` and runs
# unconditionally anyway. test-doc-examples was the filter's only consumer,
# and it executes every sample against a live LLM-backed server, so every
# integration and prose-only PR paid for four provider-credentialed runs that
# none of those files can affect.
doc-examples:
  - 'hindsight-docs/examples/**'
  - 'scripts/test-doc-examples.sh'
embed:
  - 'hindsight-embed/**'
all-npm:
  - 'hindsight-all-npm/**'
  - 'package.json'
  - 'package-lock.json'
hindsight-all:
  - 'hindsight-all/**'
integration-tests:
  - 'hindsight-integration-tests/**'
system-tests:
  - 'hindsight-system-tests/**'
# True when the PR touches anything *other* than the system-test
# package. The two unconditional-by-design jobs (build-docs and
# verify-generated-files) hang off this rather than off a positive
# filter, so they keep running for every change in the repo and only
# step aside for a PR confined to hindsight-system-tests/ — a package
# nothing generates from and the docs site never reads. Iterating on
# that suite otherwise costs ~6 minutes of unrelated CI against a
# 36-second test.
outside-system-tests:
  # A lone negation, deliberately. paths-filter builds one matcher per
  # pattern and ORs them, so adding '**' alongside would make every
  # file match and the filter always true — a change that looks right
  # and silently does nothing.
  - '!hindsight-system-tests/**'
