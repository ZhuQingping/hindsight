name: Publish Coding Agents tgz

# Build and publish only the remote Coding Agents npm package.
# Run manually and choose the branch/ref to publish from.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create/update (for example, contextbase-coding-agents-v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: coding-agents-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install repository build dependencies
        run: npm ci --ignore-scripts

      - name: Install Coding Agents dependencies
        working-directory: hindsight-integrations/coding-agents
        run: npm ci --ignore-scripts --workspaces=false

      - name: Build and test Coding Agents
        working-directory: hindsight-integrations/coding-agents
        run: |
          npm run skill:build
          npm run typecheck
          npm run build
          npm test

      - name: Verify customer installation and branding
        run: |
          node hindsight-integrations/coding-agents/scripts/test-customer-install.mjs
          bash scripts/sync-product-brand.sh --check

      - name: Package only Coding Agents
        run: |
          python scripts/package-client-plugins.py --output artifacts
          PACKAGE_DIR=$(find artifacts/contextbase-coding-agents -mindepth 2 -maxdepth 2 -type d | head -n 1)
          test -n "$PACKAGE_DIR"
          TGZ=$(find "$PACKAGE_DIR" -maxdepth 1 -type f -name '*.tgz' | head -n 1)
          test -n "$TGZ"
          test -s "$TGZ"
          test -s "$PACKAGE_DIR/SHA256SUMS"
          mkdir -p dist
          cp "$TGZ" dist/
          cp "$PACKAGE_DIR/SHA256SUMS" dist/
          (cd dist && sha256sum -c SHA256SUMS)
          echo "TARBALL=dist/$(basename "$TGZ")" >> "$GITHUB_ENV"

      - name: Publish tgz as a GitHub Release asset
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$TARBALL" dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" "$TARBALL" dist/SHA256SUMS \
              --title "Contextbase Coding Agents ${RELEASE_TAG}" \
              --notes "Standalone Contextbase Coding Agents package. Built from ${GITHUB_SHA}."
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$(basename "$TARBALL")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Coding Agents package published"
            echo
            echo "- **Tarball:** [$URL]($URL)"
            echo "- **SHA-256:** `dist/SHA256SUMS`"
            echo "- **Source commit:** ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain build artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextbase-coding-agents-tgz
          path: dist/*
          if-no-files-found: error
          retention-days: 90
