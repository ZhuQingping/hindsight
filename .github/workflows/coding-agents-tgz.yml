name: Publish Contextbase Clients

# Publish selected client packages together in one GitHub Release.
# The full candidate workflow remains the comprehensive cross-client CI.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example, contextbase-clients-v0.1.0)"
        required: true
        type: string
      coding_agents:
        description: "Build and publish Coding Agents"
        required: true
        type: boolean
        default: true
      node_sdk:
        description: "Build and publish Node.js SDK"
        required: true
        type: boolean
        default: true
      python_sdk:
        description: "Build and publish Python SDK"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: contextbase-clients-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    if: ${{ inputs.coding_agents || inputs.node_sdk || inputs.python_sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        if: ${{ inputs.coding_agents || inputs.node_sdk }}
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        if: ${{ inputs.coding_agents || inputs.node_sdk || inputs.python_sdk }}
        with:
          python-version: "3.12"

      - name: Install repository build dependencies
        if: ${{ inputs.coding_agents || inputs.node_sdk }}
        run: npm ci --ignore-scripts

      - name: Install Coding Agents dependencies
        if: ${{ inputs.coding_agents }}
        working-directory: hindsight-integrations/coding-agents
        run: npm ci --ignore-scripts --workspaces=false

      - name: Build and test Coding Agents
        if: ${{ inputs.coding_agents }}
        working-directory: hindsight-integrations/coding-agents
        run: |
          npm run skill:build
          npm run typecheck
          npm run build
          npm test

      - name: Verify Coding Agents customer installation and branding
        if: ${{ inputs.coding_agents }}
        run: |
          node hindsight-integrations/coding-agents/scripts/test-customer-install.mjs
          bash scripts/sync-product-brand.sh --check

      - name: Install Node SDK dependencies
        if: ${{ inputs.node_sdk }}
        working-directory: hindsight-clients/typescript
        run: npm ci --ignore-scripts --workspaces=false

      - name: Test Node SDK
        if: ${{ inputs.node_sdk }}
        working-directory: hindsight-clients/typescript
        run: npm test -- --runInBand --testPathIgnorePatterns=main_operations.test.ts

      - name: Verify Node SDK generation
        if: ${{ inputs.node_sdk }}
        run: python scripts/test-sdk-generation.py node

      - name: Install Python SDK build and test dependencies
        if: ${{ inputs.python_sdk }}
        run: python -m pip install build twine pytest-timeout pytest-xdist './hindsight-clients/python[test]'

      - name: Test Python SDK
        if: ${{ inputs.python_sdk }}
        run: |
          python -m pytest hindsight-clients/python/tests -o addopts='' -q \
            --ignore=hindsight-clients/python/tests/test_main_operations.py \
            --ignore=hindsight-clients/python/tests/test_attachment_download.py
          python scripts/test-sdk-generation.py python

      - name: Build selected SDK packages
        env:
          PUBLISH_NODE: ${{ inputs.node_sdk }}
          PUBLISH_PYTHON: ${{ inputs.python_sdk }}
        run: |
          mkdir -p artifacts
          if [[ "$PUBLISH_NODE" == "true" ]]; then
            python scripts/package-sdks.py node --output artifacts
          fi
          if [[ "$PUBLISH_PYTHON" == "true" ]]; then
            python scripts/package-sdks.py python --output artifacts
            python -m twine check artifacts/contextbase-python-sdk/*/*.whl artifacts/contextbase-python-sdk/*/*.tar.gz
          fi

      - name: Package selected Coding Agents distribution
        if: ${{ inputs.coding_agents }}
        run: |
          python scripts/package-client-plugins.py --output artifacts
          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('hindsight-integrations/coding-agents/package.json', 'utf8')).version")
          PACKAGE_DIR="artifacts/contextbase-coding-agents/$PACKAGE_VERSION"
          test -d "$PACKAGE_DIR" || { echo "Expected package directory not found: $PACKAGE_DIR" >&2; find artifacts/contextbase-coding-agents -maxdepth 2 -print; exit 1; }
          TGZ="$PACKAGE_DIR/contextbase-coding-agents-$PACKAGE_VERSION.tgz"
          test -s "$TGZ" || { echo "Expected tarball not found or empty: $TGZ" >&2; ls -la "$PACKAGE_DIR"; exit 1; }
          npm pack --dry-run "$TGZ"
          echo "Coding Agents package validated: $TGZ"

      - name: Stage selected release assets and checksums
        env:
          PUBLISH_CODING_AGENTS: ${{ inputs.coding_agents }}
          PUBLISH_NODE: ${{ inputs.node_sdk }}
          PUBLISH_PYTHON: ${{ inputs.python_sdk }}
        run: |
          mkdir -p dist
          if [[ "$PUBLISH_CODING_AGENTS" == "true" ]]; then
            find artifacts/contextbase-coding-agents -type f -name '*.tgz' -exec cp {} dist/ \;
          fi
          if [[ "$PUBLISH_NODE" == "true" ]]; then
            find artifacts/contextbase-node-sdk -type f -name '*.tgz' -exec cp {} dist/ \;
          fi
          if [[ "$PUBLISH_PYTHON" == "true" ]]; then
            find artifacts/contextbase-python-sdk -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          fi
          test "$(find dist -maxdepth 1 -type f | wc -l)" -gt 0
          (cd dist && sha256sum * > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Publish selected packages as GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "Contextbase Clients ${RELEASE_TAG}" \
              --notes "Selected Contextbase client packages. Built from commit ${GITHUB_SHA}. Verify downloaded assets with SHA256SUMS."
          fi
          {
            echo "## Contextbase client packages published"
            echo
            echo "Source commit: ${GITHUB_SHA}"
            echo
            for file in dist/*; do
              name=$(basename "$file")
              [[ "$name" == "SHA256SUMS" ]] && continue
              url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${name}"
              echo "- [$name]($url)"
            done
            echo
            echo "Checksum file: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SHA256SUMS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain published package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contextbase-clients-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 90
