name: ContextDB key clipboard
on:
  pull_request:
    paths:
      - "hindsight-control-plane/src/components/contextdb/**"
      - "hindsight-extensions/contextdb-service/tests/browser/key-copy.cjs"
      - ".github/workflows/contextdb-key-copy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clipboard:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked UI dependencies
        run: npm ci --script-shell=bash --workspace=hindsight-control-plane --workspace=hindsight-clients/typescript
      - name: Install isolated browser driver (no application dependency changes)
        run: npm install --prefix "$RUNNER_TEMP/clipboard-test" --no-package-lock playwright@1.57.0
      - name: Check real Chrome copy and paste over HTTP and localhost
        env:
          CLIPBOARD_PLAYWRIGHT_PATH: ${{ runner.temp }}/clipboard-test/node_modules/playwright
        run: node hindsight-extensions/contextdb-service/tests/browser/key-copy.cjs
