name: Publish Contextbase Clients

# Build, validate, and publish all approved client distributions as formal GitHub Release assets.
# This replaces the former candidate-only workflow and the separate client-publishing workflow.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example, contextbase-clients-v0.1.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  sdk-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install SDK build and test dependencies
        run: python -m pip install build twine pytest-timeout pytest-xdist './hindsight-clients/python[test]'
      - name: Test Python SDK without a live service
        run: >-
          python -m pytest hindsight-clients/python/tests -o addopts='' -q
          --ignore=hindsight-clients/python/tests/test_main_operations.py
          --ignore=hindsight-clients/python/tests/test_attachment_download.py
      - name: Verify SDK paths, wrapper coverage and Python branding
        run: python scripts/test-sdk-generation.py python
      - name: Build wheel and source archive and inspect brand names
        run: python scripts/package-sdks.py python --output artifacts
      - name: Check Python package metadata
        run: python -m twine check artifacts/contextbase-python-sdk/*/*whl artifacts/contextbase-python-sdk/*/*tar.gz
      - name: Verify wheel and source archive installation
        run: |
          for directory in artifacts/contextbase-python-sdk/*; do
            python scripts/test-sdk-installation.py python "$directory"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: contextbase-python-sdk-candidate
          path: artifacts/contextbase-python-sdk/
          if-no-files-found: error

  sdk-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Node SDK dependencies from its lockfile
        working-directory: hindsight-clients/typescript
        run: npm ci --ignore-scripts --workspaces=false
      - name: Test Node SDK without a live service
        working-directory: hindsight-clients/typescript
        run: npm test -- --runInBand --testPathIgnorePatterns=main_operations.test.ts
      - name: Verify real Node generation and data preservation
        run: python scripts/test-sdk-generation.py node
      - name: Build npm tarball and inspect brand names
        run: python scripts/package-sdks.py node --output artifacts
      - name: Verify ESM and CommonJS installation
        run: |
          for directory in artifacts/contextbase-node-sdk/*; do
            python scripts/test-sdk-installation.py node "$directory"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: contextbase-node-sdk-candidate
          path: artifacts/contextbase-node-sdk/
          if-no-files-found: error

  assistant-openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the bundled Node SDK
        run: |
          npm --prefix hindsight-clients/typescript ci --ignore-scripts --workspaces=false
          python scripts/package-sdks.py node --output sdk-build
      - name: Build and test OpenClaw remote integration
        working-directory: hindsight-integrations/openclaw
        run: |
          npm ci --ignore-scripts --workspaces=false
          npm run build
          npm test -- --maxWorkers=2
      - name: Package and install the real plugin outside the checkout
        run: |
          python scripts/package-agent-assistants.py openclaw --sdk-artifact sdk-build/contextbase-node-sdk/*/*.tgz --output artifacts
          python scripts/test-agent-assistants.py openclaw artifacts/contextbase-openclaw/*/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: contextbase-openclaw-candidate
          path: artifacts/contextbase-openclaw/
          if-no-files-found: error

  assistant-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install SDK, test and build dependencies
        run: python -m pip install build uv pytest ./hindsight-clients/python
      - name: Test the Hermes Memory Provider contract
        run: python -m pytest hindsight-integrations/hermes/tests -q
      - name: Build the bundled Python SDK
        run: python scripts/package-sdks.py python --output sdk-build
      - name: Package and install the real plugin outside the checkout
        run: |
          python scripts/package-agent-assistants.py hermes --sdk-artifact sdk-build/contextbase-python-sdk/*/*.whl --output artifacts
          python scripts/test-agent-assistants.py hermes artifacts/hermes-plugin-contextbase/*/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: contextbase-hermes-candidate
          path: artifacts/hermes-plugin-contextbase/
          if-no-files-found: error

  cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: contextbase-linux-amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: contextbase-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: contextbase-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: contextbase-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build standalone CLI
        working-directory: hindsight-cli
        run: cargo build --release --target ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1
      - name: Stage CLI and licenses
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hindsight-cli/Cargo.toml | head -n 1)
          DEST="artifacts/contextbase-cli/$VERSION/${ASSET#contextbase-}"
          mkdir -p "$DEST"
          cp "hindsight-cli/target/$TARGET/release/contextbase" "$DEST/contextbase"
          cp LICENSE "$DEST/LICENSE"
          cd hindsight-cli
          cargo fetch
          cargo about generate --offline --manifest-path Cargo.toml --config about.toml about.hbs --output-file ../artifacts/THIRD_PARTY_LICENSES.txt
          cd ..
          mv artifacts/THIRD_PARTY_LICENSES.txt "$DEST/THIRD_PARTY_LICENSES.txt"
          cd "$DEST"
          shasum -a 256 contextbase LICENSE THIRD_PARTY_LICENSES.txt > SHA256SUMS
          tar -czf "$GITHUB_WORKSPACE/artifacts/${ASSET}-${VERSION}.tar.gz" contextbase LICENSE THIRD_PARTY_LICENSES.txt SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-candidate
          path: artifacts/
          if-no-files-found: error

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify CLI installer over HTTPS
        run: python hindsight-system-tests/tests/test_client_installation.py -v
      - name: Stage installer
        run: |
          mkdir -p artifacts/installers
          cp scripts/install-contextbase.sh artifacts/installers/install-contextbase.sh
          cd artifacts/installers
          sha256sum install-contextbase.sh > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: contextbase-installer-candidate
          path: artifacts/
          if-no-files-found: error

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install brand generator dependencies
        run: npm ci --ignore-scripts
      - name: Install Coding Agents build dependencies from its lockfile
        working-directory: hindsight-integrations/coding-agents
        run: npm ci --ignore-scripts --workspaces=false
      - name: Generate and build Coding Agents
        working-directory: hindsight-integrations/coding-agents
        run: |
          npm run skill:build
          npm run typecheck
          npm run build
          npm test
      - name: Verify installed client runtime, logs and MCP tools
        working-directory: hindsight-integrations/coding-agents
        run: node scripts/test-customer-install.mjs
      - name: Verify Claude Code and Agent Plugin
        run: |
          python -m pip install pytest -r hindsight-integrations/claude-code/requirements.txt
          python -m pytest hindsight-integrations/claude-code/tests -q
          python hindsight-integrations/agent-plugin/validate.py
      - name: Package only approved plugins
        run: python scripts/package-client-plugins.py --output artifacts
      - name: Verify the audited public npm tarball and installed MCP runtime
        working-directory: hindsight-integrations/coding-agents
        run: node scripts/test-customer-install.mjs ../../artifacts/contextbase-coding-agents/*/*.tgz
      - name: Verify npm installation from an HTTPS tarball URL
        run: |
          for tarball in artifacts/contextbase-coding-agents/*/*.tgz; do
            CONTEXTBASE_TEST_NPM_TARBALL="$tarball" python hindsight-system-tests/tests/test_client_installation.py ClientInstallationStory.test_npm_installs_actual_tarball_by_https_url -v
          done
      - uses: actions/upload-artifact@v4
        with:
          name: contextbase-plugin-candidates
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish all client assets
    needs:
      - sdk-python
      - sdk-node
      - assistant-openclaw
      - assistant-hermes
      - cli
      - installer
      - plugins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Download candidate artifacts using the built-in GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*-candidate*" \
            --dir downloads

      - name: Stage all distributable packages and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            case "$name" in
              *.tgz|*.whl|*.tar.gz|*.zip|install-contextbase.sh)
                if [[ -e "dist/$name" ]]; then
                  echo "Duplicate release asset filename: $name" >&2
                  exit 1
                fi
                cp "$file" "dist/$name"
                ;;
            esac
          done < <(find downloads -type f -print0)
          if [[ -z "$(find dist -maxdepth 1 -type f -print -quit)" ]]; then
            echo "No distributable client assets were found" >&2
            find downloads -maxdepth 4 -type f -print
            exit 1
          fi
          (cd dist && sha256sum * > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          echo "Staged assets:"
          ls -lh dist/

      - name: Publish all client assets as GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Contextbase Clients ${RELEASE_TAG}" --notes "ContextBase client distributions built and tested from commit ${GITHUB_SHA}. Verify downloaded files with SHA256SUMS."
          fi
          {
            echo "## Contextbase client release published"
            echo
            echo "Source commit: ${GITHUB_SHA}"
            echo
            for file in dist/*; do
              name=$(basename "$file")
              [[ "$name" == "SHA256SUMS" ]] && continue
              url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${name}"
              echo "- [$name]($url)"
            done
            echo
            echo "[SHA256SUMS](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SHA256SUMS)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain release assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextbase-clients-release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 90
