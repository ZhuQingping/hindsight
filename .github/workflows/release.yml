name: Build agentstratum client candidates

# Huawei Cloud publication is configured separately once its public resources are confirmed.
# No push/tag trigger: these are review artifacts, not a production release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: agentstratum-linux-amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: agentstratum-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: agentstratum-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: agentstratum-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build standalone CLI
        working-directory: hindsight-cli
        run: cargo build --release --target ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1
      - name: Stage CLI and licenses
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hindsight-cli/Cargo.toml | head -n 1)
          DEST="artifacts/agentstratum-cli/$VERSION/${ASSET#agentstratum-}"
          mkdir -p "$DEST"
          cp "hindsight-cli/target/$TARGET/release/agentstratum" "$DEST/agentstratum"
          cp LICENSE "$DEST/LICENSE"
          cd hindsight-cli
          cargo fetch
          cargo about generate --offline --manifest-path Cargo.toml --config about.toml about.hbs --output-file ../artifacts/THIRD_PARTY_LICENSES.txt
          cd ..
          mv artifacts/THIRD_PARTY_LICENSES.txt "$DEST/THIRD_PARTY_LICENSES.txt"
          cd "$DEST"
          shasum -a 256 agentstratum LICENSE THIRD_PARTY_LICENSES.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-candidate
          path: artifacts/
          if-no-files-found: error

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify CLI installer over HTTPS
        run: python hindsight-system-tests/tests/test_client_installation.py -v
      - name: Stage installer
        run: |
          mkdir -p artifacts/installers
          cp scripts/install-agentstratum.sh artifacts/installers/install-agentstratum.sh
          cd artifacts/installers
          sha256sum install-agentstratum.sh > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: agentstratum-installer-candidate
          path: artifacts/
          if-no-files-found: error

  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies from the repository lockfile
        run: npm ci --ignore-scripts
      - name: Generate and build Coding Agents
        working-directory: hindsight-integrations/coding-agents
        run: |
          npm run skill:build
          npm run build
          npm test
      - name: Verify Claude Code and Agent Plugin
        run: |
          python -m pip install pytest -r hindsight-integrations/claude-code/requirements.txt
          python -m pytest hindsight-integrations/claude-code/tests -q
          python hindsight-integrations/agent-plugin/validate.py
      - name: Package only approved plugins
        run: python scripts/package-client-plugins.py --output artifacts
      - name: Verify npm installation from an HTTPS tarball URL
        run: |
          for tarball in artifacts/agentstratum-coding-agents/*/*.tgz; do
            AGENTSTRATUM_TEST_NPM_TARBALL="$tarball" python hindsight-system-tests/tests/test_client_installation.py ClientInstallationStory.test_npm_installs_actual_tarball_by_https_url -v
          done
      - uses: actions/upload-artifact@v4
        with:
          name: agentstratum-plugin-candidates
          path: artifacts/
          if-no-files-found: error
