name: Build and publish Coding Agents npm package

on:
  pull_request:
    paths:
      - "hindsight-integrations/coding-agents/**"
      - "scripts/package-coding-agents.py"
      - "scripts/test-coding-agents-package.py"
      - ".github/workflows/coding-agents-npm.yml"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified tarball to npm (requires NPM_TOKEN)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        working-directory: hindsight-integrations/coding-agents
        run: npm ci --ignore-scripts --workspaces=false
      - name: Check types, run unit tests, and build
        working-directory: hindsight-integrations/coding-agents
        run: |
          npm run typecheck
          npm test -- --maxWorkers=2
          npm run build
      - name: Test archive audit and package the public client
        run: |
          python scripts/test-coding-agents-package.py
          python scripts/package-coding-agents.py --output artifacts
      - name: Test installation and MCP using the audited tarball
        working-directory: hindsight-integrations/coding-agents
        run: node scripts/test-customer-install.mjs ../../artifacts/huaweicloud-contextbase-coding-agents/*/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: contextbase-coding-agents-npm
          path: artifacts/huaweicloud-contextbase-coding-agents/
          if-no-files-found: error
      # Token authentication is intentional: publishing from the source workflow with OIDC
      # provenance would link the private implementation repository in public npm metadata.
      - name: Publish the exact verified tarball
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo 'Configure the NPM_TOKEN repository secret before publishing.' >&2; exit 1; }
          tarballs=("$GITHUB_WORKSPACE"/artifacts/huaweicloud-contextbase-coding-agents/*/*.tgz)
          test "${#tarballs[@]}" -eq 1
          cd "$RUNNER_TEMP"
          npm publish "${tarballs[0]}" --access public --ignore-scripts --provenance=false
