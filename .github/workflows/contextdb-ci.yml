name: ContextDB Service Extension

on:
  pull_request:
    branches: [main]
    paths:
      - "hindsight-extensions/contextdb-service/**"
      - "hindsight-api-slim/**"
      - "contextbase-control-plane/**"
      - "hindsight-clients/python/**"
      - "hindsight-clients/typescript/**"
      - "hindsight-system-tests/**"
      - "scripts/**"
      - "docker/standalone/**"
      - "brand/**"
      - ".github/workflows/contextdb-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "ruff.toml"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".npmrc"
      - ".env.example"
      - "hindsight-embed/hindsight_embed/env.example"
  push:
    branches: [main]
    paths:
      - "hindsight-extensions/contextdb-service/**"
      - "hindsight-api-slim/**"
      - "contextbase-control-plane/**"
      - "hindsight-clients/python/**"
      - "hindsight-clients/typescript/**"
      - "hindsight-system-tests/**"
      - "scripts/**"
      - "docker/standalone/**"
      - "brand/**"
      - ".github/workflows/contextdb-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "ruff.toml"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".editorconfig"
      - ".gitattributes"
      - ".npmrc"
      - ".env.example"
      - "hindsight-embed/hindsight_embed/env.example"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contextdb-extension-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install pinned test package manager
        run: python -m pip install uv==0.11.2
      - name: Extension Python tests and quality checks
        run: bash hindsight-extensions/contextdb-service/scripts/run-ci.sh python "$RUNNER_TEMP/contextdb-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextdb-python-results
          path: ${{ runner.temp }}/contextdb-results/*.xml
          if-no-files-found: warn

  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      npm_config_script_shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Extension UI tests and quality checks
        run: bash hindsight-extensions/contextdb-service/scripts/run-ci.sh ui "$RUNNER_TEMP/contextdb-results"
      - name: Extension browser regression - API Key copy and paste
        run: bash hindsight-extensions/contextdb-service/scripts/run-ci.sh browser "$RUNNER_TEMP/contextdb-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextdb-ui-${{ runner.os }}-results
          path: ${{ runner.temp }}/contextdb-results/*.xml
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned test package manager
        run: python -m pip install uv==0.11.2
      - name: Install locked UI and SDK build dependencies
        run: npm ci --workspace=contextbase-control-plane --workspace=hindsight-clients/typescript
      - name: Build matching production UI
        run: bash hindsight-extensions/contextdb-service/scripts/run-ci.sh build "$RUNNER_TEMP/contextdb-results"
      - name: Extension Key contract and both Worker system suites
        run: bash hindsight-extensions/contextdb-service/scripts/run-ci.sh system "$RUNNER_TEMP/contextdb-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contextdb-integration-results
          path: ${{ runner.temp }}/contextdb-results/*.xml
          if-no-files-found: warn
