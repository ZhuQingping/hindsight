name: Browser brand audit

on:
  pull_request:
    branches: [main]
    paths:
      - "contextbase-control-plane/**"
      - "hindsight-clients/typescript/**"
      - "hindsight-extensions/contextdb-service/tests/ui/**"
      - "docker/standalone/Dockerfile"
      - "package.json"
      - "package-lock.json"
      - ".prettierrc.json"
      - ".github/workflows/browser-brand-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-brand-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-brand-audit:
    # Keep the browser production and HTTP audits independent of the full CI.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install frontend and SDK dependencies
        run: npm ci --workspace=contextbase-control-plane --workspace=hindsight-clients/typescript
      - name: Check audit formatting with repository configuration
        run: >-
          npx --no-install prettier --check
          contextbase-control-plane/scripts/audit-browser-artifacts.mjs
          contextbase-control-plane/scripts/test-browser-brand.mjs
          contextbase-control-plane/scripts/test-dev-browser-brand.mjs
          contextbase-control-plane/tests/lib/browser-artifacts.test.ts
          hindsight-extensions/contextdb-service/tests/ui/contextdb.test.ts
      - name: Test frontend and management UI
        run: npm test --workspace=contextbase-control-plane -- --maxWorkers=2
      - name: Build and scan production package
        env:
          CONTEXTBASE_CP_DATAPLANE_API_URL: https://synthetic-private-api.invalid
          CONTEXTBASE_CP_DATAPLANE_API_KEY: synthetic-private-api-key
          CONTEXTBASE_CP_ACCESS_KEY: synthetic-private-password
          BROWSER_AUDIT_PRIVATE_MARKERS: synthetic-private-api.invalid,synthetic-private-api-key,synthetic-private-password
        run: npm run build --workspace=contextbase-control-plane
      - name: Audit HTTP responses in native and management modes
        run: npm run test:browser-brand --workspace=contextbase-control-plane
      - name: Audit development resource names and content
        run: npm run test:browser-brand:dev --workspace=contextbase-control-plane
