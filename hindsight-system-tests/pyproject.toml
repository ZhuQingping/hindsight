[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hindsight-system-tests"
version = "0.1.0"
description = "Blackbox system tests: a real Hindsight server, driven only through the public API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2",
    "hindsight-client",
    # Optional-extension stories launch API/Worker from this interpreter and
    # provision their own embedded database, never the shared dev environment.
    "hindsight-api-slim[embedded-db]",
]

[tool.uv]
# Match the tested server baseline in the root lock, rather than inadvertently
# switching SDK/MCP major versions when adding optional extension stories.
constraint-dependencies = [
    "aiohttp==3.14.3", "asyncpg==0.30.0", "cohere==5.20.1", "fastapi==0.136.3",
    "fastmcp==3.2.0", "litellm==1.104.0", "mcp==1.28.1", "openai==2.24.0", "pydantic==2.12.5",
]

[tool.uv.sources]
# editable: without it uv installs a *copy*, and the suite silently tests a
# snapshot of the client taken whenever the venv was last built — an endpoint
# added or regenerated since then simply is not there. The whole point of driving
# the published client is that it is the current one.
hindsight-client = { path = "../hindsight-clients/python", editable = true }
hindsight-api-slim = { path = "../hindsight-api-slim", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["hindsight_system_tests"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
addopts = "--timeout 300 -v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
