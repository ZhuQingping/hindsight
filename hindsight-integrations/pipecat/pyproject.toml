[project]
name = "contextbase-pipecat"
version = "0.1.2"
description = "Pipecat integration for ContextBase - persistent memory for voice AI pipelines"
requires-python = ">=3.11"
license = { text = "MIT" }
maintainers = [{ name = "ContextBase Team" }]
keywords = [
    "ai",
    "memory",
    "pipecat",
    "voice",
    "agents",
    "contextbase",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pipecat-ai>=1.4.0,<2.0",  # 1.x universal LLMContext; 1.4.0 clears the file-read CVE advisories
    "contextbase-client>=1.0.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextbase_pipecat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]

[tool.uv.sources]
contextbase-client = { path = "../../hindsight-clients/python", editable = true }
