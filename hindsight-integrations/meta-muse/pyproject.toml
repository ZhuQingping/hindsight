[project]
name = "contextbase-meta-muse"
version = "0.1.1"
description = "ContextBase integration for Meta Muse — connect prompt, docs and an MCP endpoint preflight check"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",  # GHSA-cq5v-8q36-5273: OOB heap read in the C response parser
    "pydantic>=2.0",
]

[project.scripts]
contextbase-muse-preflight = "contextbase_meta_muse.preflight:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextbase_meta_muse"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
