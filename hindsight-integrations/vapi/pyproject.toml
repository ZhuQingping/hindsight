[project]
name = "contextbase-vapi"
version = "0.1.1"
description = "ContextBase persistent memory integration for Vapi voice AI"
requires-python = ">=3.10"
license = { text = "MIT" }
maintainers = [{ name = "ContextBase Team" }]
keywords = [
    "ai",
    "memory",
    "vapi",
    "voice",
    "agents",
    "contextbase",
    "webhook",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "contextbase-client>=1.0.0,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextbase_vapi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
contextbase-client = { path = "../../hindsight-clients/python", editable = true }
