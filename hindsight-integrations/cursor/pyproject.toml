[project]
name = "contextbase-cursor"
version = "0.2.1"
description = "ContextBase memory plugin for Cursor - persistent cross-session memory for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vectorize", email = "support@vectorize.io" }
]
keywords = [
    "ai",
    "memory",
    "cursor",
    "agents",
    "contextbase",
    "coding",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No runtime dependencies — the plugin scripts use stdlib only.
# The CLI itself also uses stdlib only.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
contextbase-cursor = "contextbase_cursor.cli:main"

[project.urls]
Homepage = "https://github.com/RSIXDB/hindsight"
Documentation = "https://github.com/RSIXDB/hindsight/tree/main/hindsight-integrations/cursor"
Repository = "https://github.com/RSIXDB/hindsight"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextbase_cursor"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle plugin files as package data so the CLI can copy them on init.
".cursor-plugin" = "contextbase_cursor/plugin_data/.cursor-plugin"
"hooks" = "contextbase_cursor/plugin_data/hooks"
"rules" = "contextbase_cursor/plugin_data/rules"
"scripts" = "contextbase_cursor/plugin_data/scripts"
"settings.json" = "contextbase_cursor/plugin_data/settings.json"
"skills" = "contextbase_cursor/plugin_data/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_real_llm: tests that require a live ContextBase server (excluded from the deterministic PR-CI bucket; run via `pytest -m requires_real_llm`).",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "contextbase-client>=1.0.0,<2",
]

[tool.uv.sources]
contextbase-client = { path = "../../hindsight-clients/python", editable = true }
