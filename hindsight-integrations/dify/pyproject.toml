[project]
name = "contextbase-dify"
version = "0.1.2"
description = "Persistent long-term memory for Dify workflows via ContextBase."
requires-python = ">=3.12"
license = { text = "MIT" }
maintainers = [{ name = "ContextBase Team" }]
dependencies = [
    "dify_plugin>=0.6.0",
    "contextbase-client>=1.0.0,<2",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
contextbase-client = { path = "../../hindsight-clients/python", editable = true }
