[project]
name = "contextbase-zcode"
version = "0.1.0"
description = "ZCode (Z.ai GLM) integration for contextbase - persistent long-term memory via ZCode hooks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
maintainers = [{ name = "ContextBase Team" }]
keywords = [
    "ai",
    "memory",
    "zcode",
    "glm",
    "z.ai",
    "hooks",
    "agents",
    "contextbase",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Private :: Do Not Upload",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.scripts]
contextbase-zcode = "contextbase_zcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextbase_zcode"]
# The hook payload under contextbase_zcode/hooks/ (scripts + JSON) ships as
# package data; the installer extracts it via importlib.resources.
artifacts = [
    "contextbase_zcode/hooks/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "contextbase_zcode/**/*",
    "tests/**/*",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.8.0",
]
