[project]
name = "contextbase-copilot-cli"
version = "0.1.1"
description = "GitHub Copilot CLI integration for ContextBase - persistent long-term memory via Copilot CLI hooks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
maintainers = [{ name = "ContextBase Team" }]
keywords = [
    "ai",
    "memory",
    "github-copilot",
    "copilot-cli",
    "hooks",
    "agents",
    "contextbase",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.scripts]
contextbase-copilot-cli = "contextbase_copilot_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextbase_copilot_cli"]
# The hook payload under contextbase_copilot_cli/hooks/ (scripts + JSON) ships as
# package data; the installer extracts it via importlib.resources.
artifacts = [
    "contextbase_copilot_cli/hooks/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "contextbase_copilot_cli/**/*",
    "tests/**/*",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.8.0",
]
