[project]
name = "contextbase-agentcore"
version = "0.1.3"
description = "Persistent memory for Amazon Bedrock AgentCore Runtime agents using ContextBase"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
maintainers = [{ name = "ContextBase Team" }]
keywords = ["aws", "agentcore", "bedrock", "contextbase", "memory", "agents", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "contextbase-client>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextbase_agentcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
contextbase-client = { path = "../../hindsight-clients/python", editable = true }
