[project]
name = "hermes-plugin-contextbase"
version = "1.2.2"
description = "Hermes Agent memory provider plugin: contextbase"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Hermes venv by `hermes plugins install` / `enable` and re-applied after
# every `hermes update`. Keep upper bounds: Hermes pins its own deps exactly and refuses a
# plugin whose requirements cannot resolve against them.
dependencies = ["contextbase-client>=1.0.0,<2", "packaging>=23"]

# The plugin is loaded from a directory by Hermes, not installed as a distribution.
[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
contextbase-client = { path = "../../hindsight-clients/python", editable = true }
