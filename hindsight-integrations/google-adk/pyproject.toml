[project]
name = "contextbase-google-adk"
version = "0.1.1"
description = "Google ADK integration for ContextBase - persistent long-term memory for ADK agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vectorize", email = "support@vectorize.io" }
]
keywords = [
    "ai",
    "memory",
    "google-adk",
    "adk",
    "agents",
    "contextbase",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "google-adk>=2.0",
    "contextbase-client>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/RSIXDB/hindsight"
Documentation = "https://github.com/RSIXDB/hindsight/tree/main/hindsight-integrations/google-adk"
Repository = "https://github.com/RSIXDB/hindsight"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contextbase_google_adk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.uv.sources]
contextbase-client = { path = "../../hindsight-clients/python", editable = true }
