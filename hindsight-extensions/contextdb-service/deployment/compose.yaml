# API enables its in-process worker only when rendered intent.topology=merged.
# For split mode render topology=split, then add --profile split to up.
x-common: &common
  image: ${CONTEXTDB_IMAGE:?Set an immutable own-build image tag or digest}
  user: "${CONTEXTDB_UID:-10001}:${CONTEXTDB_GID:-10001}"
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=256m
  environment:
    CONTEXTDB_DEPLOY_DIR: /var/lib/contextdb
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  initialize:
    <<: *common
    profiles: [initialize]
    restart: "no"
    command: [init]
    volumes:
      - ${CONTEXTDB_DEPLOY_DIR}:/var/lib/contextdb:rw
  api:
    <<: *common
    command: [api]
    volumes:
      - ${CONTEXTDB_DEPLOY_DIR:?Set the private persistent deployment directory}/api.env:/var/lib/contextdb/api.env:ro
      - ${CONTEXTDB_DEPLOY_DIR}/api-secrets.json:/var/lib/contextdb/api-secrets.json:ro
    ports:
      - "${CONTEXTDB_API_PORT:-8888}:${CONTEXTDB_API_PORT:-8888}"
    healthcheck:
      test: [CMD-SHELL, '. /var/lib/contextdb/api.env; /app/.venv/bin/python -m hindsight_api.http_probe "http://127.0.0.1:$$HINDSIGHT_API_PORT/health/ready" 3']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
  worker:
    <<: *common
    profiles: [split]
    command: [worker]
    volumes:
      - ${CONTEXTDB_DEPLOY_DIR}/api.env:/var/lib/contextdb/api.env:ro
      - ${CONTEXTDB_DEPLOY_DIR}/api-secrets.json:/var/lib/contextdb/api-secrets.json:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -m, hindsight_api.http_probe, "http://127.0.0.1:8889/health", "3"]
      interval: 15s
      timeout: 5s
      retries: 6
  ui:
    <<: *common
    command: [ui]
    # Next initializes image-cache storage even for rejected image requests.
    # Keep the root filesystem read-only; this bounded cache is disposable.
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /app/hindsight-control-plane/standalone/.next/cache:mode=1777,size=64m
    volumes:
      - ${CONTEXTDB_DEPLOY_DIR}/ui.env:/var/lib/contextdb/ui.env:ro
      - ${CONTEXTDB_DEPLOY_DIR}/ui-secrets.json:/var/lib/contextdb/ui-secrets.json:ro
    ports:
      - "${CONTEXTDB_UI_PORT:-9999}:${CONTEXTDB_UI_PORT:-9999}"
    depends_on:
      api:
        condition: service_healthy
