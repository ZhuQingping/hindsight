components:
  schemas:
    AdminSession:
      properties:
        user_id:
          type: string
          title: User Id
        role:
          type: string
          const: admin
          title: Role
          default: admin
        instance_id:
          type: string
          title: Instance Id
        cloud_tenant_id:
          type: string
          title: Cloud Tenant Id
      type: object
      required:
      - user_id
      - instance_id
      - cloud_tenant_id
      title: AdminSession
    AllAuthorization:
      properties:
        mode:
          type: string
          const: all
          title: Mode
        permission:
          $ref: '#/components/schemas/Permission'
          default: read_write
      additionalProperties: false
      type: object
      required:
      - mode
      title: AllAuthorization
    ApiKeyCreate:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
        authorization:
          oneOf:
          - $ref: '#/components/schemas/SelectedAuthorization-Input'
          - $ref: '#/components/schemas/AllAuthorization'
          title: Authorization
          discriminator:
            propertyName: mode
            mapping:
              all: '#/components/schemas/AllAuthorization'
              selected: '#/components/schemas/SelectedAuthorization-Input'
      additionalProperties: false
      type: object
      required:
      - name
      - authorization
      title: ApiKeyCreate
    ApiKeyPatch:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          title: Name
        authorization:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/ExplicitSelectedAuthorization'
            - $ref: '#/components/schemas/ExplicitAllAuthorization'
            discriminator:
              propertyName: mode
              mapping:
                all: '#/components/schemas/ExplicitAllAuthorization'
                selected: '#/components/schemas/ExplicitSelectedAuthorization'
          - type: 'null'
          title: Authorization
