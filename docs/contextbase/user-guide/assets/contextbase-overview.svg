<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent 与 ContextBase 的协作</title>
  <desc id="desc">当前任务进入 Agent。Agent 按需通过 Recall 从 ContextBase 取回相关记忆，或通过 Reflect 获取基于记忆生成的回答。Agent 调用模型与工具，形成回答或行动，并可通过 Retain 将值得保留的任务记录写入 ContextBase，供后续任务使用。图中接口按需调用，不表示固定执行顺序。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L11 7 L2 12" fill="none" stroke="#24648b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="gray-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L11 7 L2 12" fill="none" stroke="#77818a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #202e39; }
      .flow { fill: none; stroke: #24648b; stroke-width: 2.5; }
      .quiet { fill: #566570; }
      .blue { fill: #24648b; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <text x="80" y="106" font-size="44" font-weight="700">Agent 与 ContextBase 的协作</text>

  <text x="280" y="204" text-anchor="middle" font-size="32">当前任务</text>
  <path d="M280 226 V277" fill="none" stroke="#77818a" stroke-width="2.5" marker-end="url(#gray-arrow)"/>

  <rect x="80" y="280" width="400" height="420" rx="4" fill="#f7f8fa" stroke="#b5bfc8" stroke-width="1.5"/>
  <text x="120" y="348" font-size="44" font-weight="700">Agent</text>
  <path d="M120 377 H440" stroke="#d2d9df" stroke-width="1.5"/>
  <text x="120" y="450" font-size="30">理解与规划</text>
  <text x="120" y="550" font-size="30">调用模型与工具</text>
  <text x="120" y="650" font-size="30">形成回答与行动</text>

  <rect x="1100" y="280" width="420" height="420" rx="4" fill="#f2f7fa" stroke="#9bb4c5" stroke-width="1.5"/>
  <text x="1140" y="348" font-size="40" font-weight="700">ContextBase</text>
  <path d="M1140 377 H1480" stroke="#c7d8e2" stroke-width="1.5"/>
  <text x="1140" y="450" font-size="34" font-weight="500">长期记忆</text>
  <text x="1140" y="498" font-size="28" class="quiet">事实 · 经历 · 观察</text>
  <text x="1140" y="597" font-size="30">来源与关联</text>
  <text x="1140" y="645" font-size="28" class="quiet">文档 · 分块 · 实体</text>

  <!-- Recall and Reflect are independent, optional calls from the Agent workflow. -->
  <text x="790" y="419" text-anchor="middle" font-size="31" class="blue">Recall · 取回相关记忆</text>
  <path d="M1098 450 H483" class="flow" marker-end="url(#blue-arrow)"/>
  <text x="790" y="519" text-anchor="middle" font-size="31" class="quiet">Reflect · 按需生成回答</text>
  <path d="M1098 550 H483" fill="none" stroke="#77818a" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#gray-arrow)"/>

  <!-- Retain is an explicit write, rather than implicit capture of every Agent action. -->
  <text x="790" y="619" text-anchor="middle" font-size="31" class="blue">Retain · 写入任务记录</text>
  <path d="M482 650 H1097" class="flow" marker-end="url(#blue-arrow)"/>

  <path d="M280 703 V765" fill="none" stroke="#77818a" stroke-width="2.5" marker-end="url(#gray-arrow)"/>
  <text x="280" y="817" text-anchor="middle" font-size="32">回答 / 执行结果</text>
</svg>
