services:
  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: contextbase-monitoring
    ports:
      # Grafana UI
      - "3000:3000"
      # OTLP gRPC (traces)
      - "4317:4317"
      # OTLP HTTP (traces)
      - "4318:4318"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      # Mount Prometheus config for scraping contextbase API metrics (override LGTM default)
      - ./prometheus.yml:/otel-lgtm/prometheus.yaml:ro
      # Mount contextbase dashboards to LGTM directory (where default dashboards are)
      - ../../../monitoring/grafana/dashboards/contextbase-operations.json:/otel-lgtm/contextbase-operations.json:ro
      - ../../../monitoring/grafana/dashboards/contextbase-llm.json:/otel-lgtm/contextbase-llm.json:ro
      - ../../../monitoring/grafana/dashboards/contextbase-api-service.json:/otel-lgtm/contextbase-api-service.json:ro
      # Mount custom dashboard provisioning config that includes contextbase dashboards
      - ./grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
    restart: unless-stopped
    networks:
      - contextbase
    extra_hosts:
      # Allow container to reach host services (contextbase API on localhost:8888)
      - "host.docker.internal:host-gateway"

networks:
  contextbase:
    name: contextbase-network
    external: true
