services:
  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: agentstratum-monitoring
    ports:
      # Grafana UI
      - "3000:3000"
      # OTLP gRPC (traces)
      - "4317:4317"
      # OTLP HTTP (traces)
      - "4318:4318"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      # Mount Prometheus config for scraping agentstratum API metrics (override LGTM default)
      - ./prometheus.yml:/otel-lgtm/prometheus.yaml:ro
      # Mount agentstratum dashboards to LGTM directory (where default dashboards are)
      - ../../../monitoring/grafana/dashboards/agentstratum-operations.json:/otel-lgtm/agentstratum-operations.json:ro
      - ../../../monitoring/grafana/dashboards/agentstratum-llm.json:/otel-lgtm/agentstratum-llm.json:ro
      - ../../../monitoring/grafana/dashboards/agentstratum-api-service.json:/otel-lgtm/agentstratum-api-service.json:ro
      # Mount custom dashboard provisioning config that includes agentstratum dashboards
      - ./grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml:ro
    restart: unless-stopped
    networks:
      - agentstratum
    extra_hosts:
      # Allow container to reach host services (agentstratum API on localhost:8888)
      - "host.docker.internal:host-gateway"

networks:
  agentstratum:
    name: agentstratum-network
    external: true
