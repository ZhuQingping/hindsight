apiVersion: 1

providers:
  # Default LGTM dashboards
  - name: "RED Metrics (classic histogram)"
    type: file
    options:
      path: /otel-lgtm/grafana-dashboard-red-metrics-classic.json
      foldersFromFilesStructure: false
  - name: "RED Metrics (exponential/native histogram)"
    type: file
    options:
      path: /otel-lgtm/grafana-dashboard-red-metrics-native.json
      foldersFromFilesStructure: false
  - name: "JVM Metrics"
    type: file
    options:
      path: /otel-lgtm/grafana-dashboard-jvm-metrics.json
      foldersFromFilesStructure: false

  # contextbase dashboards
  - name: "contextbase Operations"
    type: file
    options:
      path: /otel-lgtm/contextbase-operations.json
      foldersFromFilesStructure: false
  - name: "contextbase LLM"
    type: file
    options:
      path: /otel-lgtm/contextbase-llm.json
      foldersFromFilesStructure: false
  - name: "contextbase API Service"
    type: file
    options:
      path: /otel-lgtm/contextbase-api-service.json
      foldersFromFilesStructure: false
