apiVersion: 1

providers:
  # Default LGTM dashboards
  - name: "RED Metrics (classic histogram)"
    type: file
    options:
      path: /otel-lgtm/grafana-dashboard-red-metrics-classic.json
      foldersFromFilesStructure: false
  - name: "RED Metrics (exponential/native histogram)"
    type: file
    options:
      path: /otel-lgtm/grafana-dashboard-red-metrics-native.json
      foldersFromFilesStructure: false
  - name: "JVM Metrics"
    type: file
    options:
      path: /otel-lgtm/grafana-dashboard-jvm-metrics.json
      foldersFromFilesStructure: false

  # agentstratum dashboards
  - name: "agentstratum Operations"
    type: file
    options:
      path: /otel-lgtm/agentstratum-operations.json
      foldersFromFilesStructure: false
  - name: "agentstratum LLM"
    type: file
    options:
      path: /otel-lgtm/agentstratum-llm.json
      foldersFromFilesStructure: false
  - name: "agentstratum API Service"
    type: file
    options:
      path: /otel-lgtm/agentstratum-api-service.json
      foldersFromFilesStructure: false
